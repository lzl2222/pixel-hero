<style>
:root{--px:2px;--bs:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0618;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;position:fixed;width:100%;font-family:"PixelFont","PingFang SC","Microsoft YaHei",sans-serif}
#stage{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:768px;height:432px}
canvas#c{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:-moz-crisp-edges;touch-action:none}
#fx{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.34) 100%),repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) calc(var(--px)*.62),rgba(0,0,0,.13) calc(var(--px)*.62),rgba(0,0,0,.13) var(--px))}
body.lq #fx{background:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#c8b8ff;font-size:18px;background:#0a0618;z-index:30;letter-spacing:2px;flex-direction:column;gap:10px}
#loading i{display:block;width:140px;height:6px;background:#2a2050;border:1px solid #6a58b8}#loading b{display:block;height:100%;width:0;background:#ffd23c}
#touch{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;display:none;z-index:5}
body.touch.inplay #touch{display:block}
#zoneL{position:absolute;left:0;top:12%;bottom:0;width:50%;pointer-events:auto;touch-action:none}
body.lefty #zoneL{left:auto;right:0}
#joy{position:fixed;display:none;width:calc(var(--jr)*2.4);height:calc(var(--jr)*2.4);border-radius:50%;border:3px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);transform:translate(-50%,-50%);pointer-events:none;opacity:.8}
#joy.on{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.12)}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;border-radius:50%;background:rgba(255,255,255,.34);border:2px solid rgba(255,255,255,.62);transform:translate(-50%,-50%)}
:root{--jr:clamp(34px,10.5vh,56px);--b1:calc(clamp(66px,25vh,112px)*var(--bs));--b2:calc(clamp(58px,21.5vh,98px)*var(--bs));--b3:calc(clamp(50px,18vh,86px)*var(--bs))}
.tb{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"PixelFont","PingFang SC",sans-serif;background:rgba(255,255,255,.13);border:3px solid rgba(255,255,255,.4);text-shadow:2px 2px 0 rgba(0,0,0,.6),-1px -1px 0 rgba(0,0,0,.4)}
.tb.on{background:rgba(255,215,90,.45);border-color:rgba(255,230,140,.95);transform:scale(.93)}
#btnJump{width:var(--b1);height:var(--b1);right:calc(env(safe-area-inset-right,0px) + 2.2vw);bottom:calc(env(safe-area-inset-bottom,0px) + 5vh);font-size:calc(var(--b1)*.34)}
#btnAtk{width:var(--b2);height:var(--b2);right:calc(env(safe-area-inset-right,0px) + 2.2vw + var(--b1) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 5vh);font-size:calc(var(--b2)*.28);border-color:rgba(255,160,140,.55)}
#btnDash{width:var(--b3);height:var(--b3);right:calc(env(safe-area-inset-right,0px) + 2.2vw + var(--b1)*.55);bottom:calc(env(safe-area-inset-bottom,0px) + 5vh + var(--b1) + 8px);font-size:calc(var(--b3)*.3);border-color:rgba(140,220,255,.55)}
body.lefty #btnJump{right:auto;left:calc(env(safe-area-inset-left,0px) + 2.2vw)}
body.lefty #btnAtk{right:auto;left:calc(env(safe-area-inset-left,0px) + 2.2vw + var(--b1) + 12px)}
body.lefty #btnDash{right:auto;left:calc(env(safe-area-inset-left,0px) + 2.2vw + var(--b1)*.55)}
#topbtns{position:fixed;right:calc(env(safe-area-inset-right,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 6px);display:flex;gap:8px;z-index:6}
body.lefty #topbtns{right:auto;left:calc(env(safe-area-inset-left,0px) + 8px)}
#topbtns button{width:40px;height:40px;border-radius:9px;border:2px solid rgba(255,255,255,.4);background:rgba(20,10,50,.45);position:relative;padding:0;pointer-events:auto;touch-action:none;cursor:pointer}
body:not(.inplay) #bPause{display:none}
body:not(.inplay):not(.inmenu) #bFs{display:none}
#bPause i{position:absolute;top:11px;width:5px;height:16px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}#bPause i:nth-child(1){left:11px}#bPause i:nth-child(2){left:22px}
#bFs i{position:absolute;width:10px;height:10px;border:3px solid #fff}#bFs i:nth-child(1){left:8px;top:8px;border-right:0;border-bottom:0}#bFs i:nth-child(2){right:8px;top:8px;border-left:0;border-bottom:0}#bFs i:nth-child(3){left:8px;bottom:8px;border-right:0;border-top:0}#bFs i:nth-child(4){right:8px;bottom:8px;border-left:0;border-top:0}
#rot{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#2a1860,#0a0618);display:none;z-index:40;flex-direction:column;align-items:center;justify-content:center;color:#ffe9a8;font-size:20px;text-align:center;gap:26px;padding:20px}
body.portrait #rot{display:flex}
#rot .ph{width:56px;height:96px;border:5px solid #ffe9a8;border-radius:10px;position:relative;animation:rot 2.4s ease-in-out infinite}
#rot .ph:after{content:"";position:absolute;left:50%;bottom:6px;width:14px;height:4px;margin-left:-7px;background:#ffe9a8;border-radius:2px}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (pointer:coarse){#topbtns button{width:46px;height:46px}#bPause i{top:13px;height:18px;width:6px}#bPause i:nth-child(1){left:12px}#bPause i:nth-child(2){left:26px}}
</style>
